# ===================================================================
# TASKNEST - MySQL Database Configuration
# ===================================================================

# Database connection URL (automatically creates database 'tasknest_db' if it doesn't exist)
spring.datasource.url=jdbc:mysql://localhost:3306/tasknest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

# -------------------------------------------------------------------
# ENTER YOUR MYSQL USERNAME AND PASSWORD BELOW:
# Default username is usually 'root'
# -------------------------------------------------------------------
spring.datasource.username=root
spring.datasource.password=Karnika1234!

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080
